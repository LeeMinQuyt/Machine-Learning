[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-algorithms-vn"
version = "0.1.0"
description = "Các thuật toán Machine Learning cơ bản được cài đặt bằng NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
